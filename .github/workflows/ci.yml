name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bridge
            component: bridge
          - name: alexa-skill
            component: alexa

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        if: matrix.component == 'bridge'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify Spring bridge
        if: matrix.component == 'bridge'
        working-directory: bridge
        run: ./gradlew clean test

      - name: Set up Node.js
        if: matrix.component == 'alexa'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: alexa-skill/lambda/package-lock.json

      - name: Verify Alexa adapter
        if: matrix.component == 'alexa'
        working-directory: alexa-skill/lambda
        run: |
          npm ci
          npm test
          npm run check

      - name: Validate Alexa JSON resources
        if: matrix.component == 'alexa'
        working-directory: alexa-skill
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; for (const file of ['skill-package/skill.json', 'skill-package/interactionModels/custom/fr-FR.json', 'ask-resources.json']) JSON.parse(readFileSync(file, 'utf8')); console.log('Alexa JSON valid')"

  docker:
    name: docker (bridge)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./bridge
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
