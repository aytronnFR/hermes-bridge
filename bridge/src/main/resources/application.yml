spring:
  application:
    name: hermes-bridge
  main:
    banner-mode: off

bridge:
  api-key: ${HERMES_BRIDGE_API_KEY:}
  public-url: ${BRIDGE_PUBLIC_URL:}

hermes:
  gateway:
    base-url: ${HERMES_GATEWAY_URL:https://hermes-gateway-api.aytronn.com}
    api-key: ${HERMES_GATEWAY_API_KEY:}
    model: ${HERMES_GATEWAY_MODEL:alexa}

tts:
  base-url: ${TTS_BASE_URL:http://hermes-kokoro:8880}
  model: ${TTS_MODEL:kokoro}
  voice: ${TTS_VOICE:ff_siwis}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never

